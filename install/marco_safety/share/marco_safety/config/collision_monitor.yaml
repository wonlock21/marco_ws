### MarCO collision_monitor — Faz 8 ###
#
# Zincir: Nav2 smoother → /cmd_vel_raw → collision_monitor → /cmd_vel_safe
#         → twist_mux → /cmd_vel → base_driver
#
# Sartname: engelde DUR (kacinma yok). Yavaslama bolgesi + durma bolgesi.
# Ayak izi CAD'e yakin (base_footprint): x -1.18..+0.50, y ±0.35

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_raw"
    cmd_vel_out_topic: "cmd_vel_safe"
    transform_tolerance: 0.5
    # LiDAR kisa sure dusse bile fail-safe: kaynak zaman asiminda DUR.
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 1.0

    polygons: ["PolygonStop", "PolygonSlow"]

    # On (+x govde) agirlikli durma bolgesi — footprint'ten biraz genis.
    PolygonStop:
      type: "polygon"
      points: [0.85, 0.45, 0.85, -0.45, -0.40, -0.45, -0.40, 0.45]
      action_type: "stop"
      max_points: 2
      visualize: true
      polygon_pub_topic: "polygon_stop"
      enabled: true

    # Daha genis yavaslama bolgesi.
    PolygonSlow:
      type: "polygon"
      points: [1.30, 0.60, 1.30, -0.60, -1.40, -0.60, -1.40, 0.60]
      action_type: "slowdown"
      max_points: 3
      slowdown_ratio: 0.25
      visualize: true
      polygon_pub_topic: "polygon_slowdown"
      enabled: true

    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      enabled: true
