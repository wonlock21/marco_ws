### MarCO twist_mux — Faz 8 ###
#
# Oncelik (AGENT_REFERANS): estop > dock > manual > nav
# Cikis: /cmd_vel → base_driver

twist_mux:
  ros__parameters:
    use_sim_time: false
    topics:
      navigation:
        topic: cmd_vel_safe
        timeout: 0.5
        priority: 10
      manual:
        topic: cmd_vel_manual
        timeout: 0.5
        priority: 100
      docking:
        topic: cmd_vel_dock
        timeout: 0.5
        priority: 120
    locks:
      # True iken priority < 255 olan tum girisler kesilir.
      estop:
        topic: base/estop
        timeout: 0.0
        priority: 255
      # Manuel modda nav (10) kilitlenir; manual/dock devam edebilir.
      manual_mode:
        topic: base/manual_mode
        timeout: 0.0
        priority: 50
