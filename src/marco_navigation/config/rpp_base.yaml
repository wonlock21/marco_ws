# Ortak Regulated Pure Pursuit + RotationShim tabanı (sim + gerçek).
# Ortak sözleşme burada; yalnız donanım/simülasyon farkları
# rpp_override_real.yaml / rpp_override_sim.yaml içinde tutulur.
#
# Launch: navigation.launch / route.launch / simulation_navigation.launch
# bu dosyayı nav2_*_params.yaml içindeki FollowPath üzerine yazar.

FollowPath:
  plugin: "nav2_rotation_shim_controller::RotationShimController"
  primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
  # Shim esigi pi: Reeds-Shepp geri segmentleri RPP'ye geri olarak kalsin.
  angular_dist_threshold: 3.14
  forward_sampling_distance: 0.50
  rotate_to_heading_angular_vel: 0.40
  max_angular_accel: 1.20
  simulate_ahead_time: 1.0
  rotate_to_goal_heading: true
  closed_loop: true
  desired_linear_vel: 0.40
  lookahead_dist: 0.60
  min_lookahead_dist: 0.30
  max_lookahead_dist: 0.90
  lookahead_time: 1.5
  transform_tolerance: 0.30
  use_velocity_scaled_lookahead_dist: true
  min_approach_linear_velocity: 0.05
  approach_velocity_scaling_dist: 0.60
  use_collision_detection: true
  max_allowed_time_to_collision_up_to_carrot: 1.2
  use_regulated_linear_velocity_scaling: true
  use_cost_regulated_linear_velocity_scaling: true
  cost_scaling_dist: 0.35
  cost_scaling_gain: 1.0
  inflation_cost_scaling_factor: 3.0
  regulated_linear_scaling_min_radius: 0.90
  regulated_linear_scaling_min_speed: 0.08
  use_rotate_to_heading: false
  allow_reversing: true
  max_robot_pose_search_dist: 10.0

# RPP ile ayni hiz/ivme sozlesmesinin ortak tavanlari.
# use_sim_time / odom_topic gibi ortam alanlari nav2_*_params.yaml'de kalir.
velocity_smoother:
  max_velocity: [0.40, 0.0, 0.55]
  min_velocity: [-0.30, 0.0, -0.55]
  max_accel: [0.50, 0.0, 1.00]
  max_decel: [-1.00, 0.0, -1.20]
