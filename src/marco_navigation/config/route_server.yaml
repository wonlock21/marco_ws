### nav2_route Route Server — MarCO Faz 7 ###
#
# Serbest NavFn yerine tanimli GeoJSON rota aginda en kisa/en hizli yol.
# CostmapScorer statik haritadaki duvarla veya harita disiyla kesisen
# ogretilmis kenari gecersiz sayar. Dinamik engel davranisi safety zincirindedir.
# TimeScorer + DistanceScorer = rota optimizasyonu (madde 5).

route_server:
  ros__parameters:
    use_sim_time: false
    base_frame: "base_footprint"
    route_frame: "map"
    # path_density korunur. smooth_corners kapali: Route Server kose kesmez;
    # operatör yay/polyline'i GeoJSON'da kendisi çizer.
    path_density: 0.05
    max_iterations: 0
    max_planning_time: 2.0
    smooth_corners: false
    costmap_topic: "global_costmap/costmap_raw"
    tracker_update_rate: 20.0
    aggregate_blocked_ids: false
    boundary_radius_to_achieve_node: 0.50
    radius_to_achieve_node: 0.40
    max_prune_dist_from_edge: 2.0
    min_prune_dist_from_goal: 0.15
    min_prune_dist_from_start: 0.30
    prune_goal: true
    enable_nn_search: true
    max_nn_search_iterations: 10000
    num_nearest_nodes: 5

    # Launch dosyasi graph_filepath'i mutlak yolla yazar.
    graph_filepath: ""
    graph_file_loader: "GeoJsonGraphFileLoader"
    GeoJsonGraphFileLoader:
      plugin: "nav2_route::GeoJsonGraphFileLoader"

    edge_cost_functions: ["DistanceScorer", "CostmapScorer", "TimeScorer", "PenaltyScorer", "DynamicEdgesScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
      weight: 1.0
    CostmapScorer:
      plugin: "nav2_route::CostmapScorer"
      weight: 1.0
      costmap_topic: "global_costmap/costmap_raw"
      max_cost: 253.0
      use_maximum: true
      invalid_on_collision: true
      invalid_off_map: true
      check_resolution: 1
    TimeScorer:
      plugin: "nav2_route::TimeScorer"
      weight: 1.0
      speed_tag: "abs_speed_limit"
      max_vel: 0.50
    # graph_model, dugum yaw'indan donus maliyetini ve q5 bekleme suresini
    # planning_penalty metadata'sina yazar.
    PenaltyScorer:
      plugin: "nav2_route::PenaltyScorer"
      weight: 1.0
      penalty_tag: "planning_penalty"
    DynamicEdgesScorer:
      plugin: "nav2_route::DynamicEdgesScorer"

    # AdjustSpeedLimit ComputeAndTrackRoute kullanan araclar icin korunur.
    # Uretim ComputeRoute -> FollowPath zincirinde route_guard aktif kenarin
    # abs_speed_limit degerini ayni /route_speed_limit konusuna yazar.
    operations: ["AdjustSpeedLimit"]
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
      speed_limit_topic: "route_speed_limit"
      speed_tag: "abs_speed_limit"
