# Docking kontrol parametreleri (Faz 9).

dock_server:
  ros__parameters:
    control_rate_hz: 20.0
    # Sartname: docking hizi ~0.05 m/s
    max_linear_vel: 0.05
    max_angular_vel: 0.40
    kp_lateral: 1.2
    kp_heading: 1.5
    kp_longitudinal: 0.6
    lane_timeout_s: 0.5
    qr_timeout_s: 0.5
    camera_timeout_s: 0.7
    settle_cycles: 8
    min_lane_confidence: 0.3
    min_qr_confidence: 0.3
    # Sim target is optical-axis camera-to-QR distance; chosen before the floor
    # QR leaves the calibrated field of view. Real hardware must recalibrate it.
    target_stop_distance_m: 0.75
    longitudinal_tolerance_m: 0.05
    front_camera_frame: camera_front_optical_frame
    rear_camera_frame: camera_rear_optical_frame
    # Tek fiziksel kamera robotun arkasindadir; usb_cam bu ortak topic'i acar.
    rear_camera_topic: /camera/image_raw
    lane_command_topic: /cmd_vel_lane
    lane_active_topic: /lane_tracking/active
    task_command_topic: /task_command
    filtered_odom_topic: /odometry/filtered
    lane_command_timeout_s: 0.30
    lane_active_timeout_s: 0.50
    activation_timeout_s: 2.0
    zero_command_timeout_s: 0.40
    odom_timeout_s: 0.50
    stop_timeout_s: 3.0
    stop_settle_s: 0.40
    stop_linear_tolerance: 0.01
    stop_angular_tolerance: 0.03
    # Arka kamera + geri hareket icin direksiyon isareti. Fiziksel kabulte
    # arac seritten ters yone kacarsa yalniz bu deger +1.0 yapilmalidir.
    reverse_angular_sign: -1.0
