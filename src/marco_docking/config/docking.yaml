# Docking kontrol parametreleri (Faz 9).

dock_server:
  ros__parameters:
    control_rate_hz: 20.0
    # Sartname: docking hizi ~0.05 m/s
    max_linear_vel: 0.05
    max_angular_vel: 0.40
    kp_lateral: 1.2
    kp_heading: 1.5
    lane_lost_timeout_s: 1.5
    settle_cycles: 10
    min_confidence: 0.3
    align_heading_tol: 0.12
    align_lateral_tol: 0.10
