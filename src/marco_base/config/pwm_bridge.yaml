marco_pwm_bridge:
  ros__parameters:
    # --- Donanim baglantisi ---
    serial_port: /dev/marco_stm32
    baudrate: 115200
    use_fake_hardware: false

    # --- PWM araligi ---
    # Eski/acik dongu PWM kaynaklari 0..150 araligini kullanir. Bu sinirlar
    # bagimsiz dogrulamadir; tasan degerlerin motora ulasmasini engeller.
    pwm_min: 0.0
    pwm_max: 150.0

    # --- Zamanlama ---
    command_rate: 50.0
    read_rate: 200.0
    # Kamera goruntusu kesilirse arac durur. STM32 watchdog'u (200 ms) son
    # savunma hatti; bu deger normal isleyisteki ilk hat.
    pwm_timeout: 0.5

    # --- Sahte donanim ---
    # Yalnizca use_fake_hardware: true iken kurulur. Kinematik degerler
    # base_driver.yaml / properties.xacro ile ayni olmali.
    wheel_radius: 0.100
    wheel_separation: 0.460
    # Firmware bir turda yonlu/kumulatif 360 tick gonderir; tekrar x4 uygulanmaz.
    ticks_per_revolution: 360
    max_wheel_speed: 0.838
    # Tam gaza karsilik gelen PWM (firmware timer ARR). Taklit bu olcekle
    # PWM'i hiza cevirir; gercek donanimda kullanilmaz.
    pwm_full_scale: 255.0
