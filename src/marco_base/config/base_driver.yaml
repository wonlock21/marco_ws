marco_base_driver:
  ros__parameters:
    # --- Donanim baglantisi ---
    serial_port: /dev/ttyACM0
    baudrate: 115200
    use_fake_hardware: false

    # --- Kinematik ---
    # wheel_radius fiziksel URDF degeridir. wheel_separation ise encoder
    # odometrisi icin etkin araliktir; URDF'deki 0.460 m geometrik araliktan
    # farkli olabilir.
    #
    # wheel_radius ve URDF'deki geometrik aralik SolidWorks'ten olculdu;
    # bu dosyadaki etkin aralik daha sonra saha donusleriyle kalibre edildi:
    #   wheel_radius     tahrik tekeri kusursuz silindir, yaricap 100.00 mm
    #                    (dis kabuk sacilimi 0.000 mm)
    #   geometrik aralik teker merkezleri x=135.40 ve x=595.40 -> 460.00 mm
    #
    # NOT: tahrik uniteleri yayli (4 adet 3 mm telli, 75 mm serbest boy
    # helezon yay). CAD'de teker zeminden 11.5 mm yukarida cizilmis; arac
    # agirligi altinda yaylar sikisip teker basiyor. Etkin yaricap yuk
    # altinda lastik ezilmesi kadar azalabilir, odometry_check.py ile
    # dogrulanmali.
    wheel_radius: 0.100
    # 03.09.2026 fiziksel 360 derece testi: sol 0.432778 m, sag 0.433333 m;
    # iki yon ortalamasi 0.433056 m, config hassasiyetiyle 0.433 m.
    wheel_separation: 0.433
    # Firmware bir turda yonlu/kumulatif 360 tick gonderir; tekrar x4 uygulanmaz.
    ticks_per_revolution: 360
    # /cmd_vel bu fiziksel m/s sinirinda oransal kirpilir, ardindan 0x01 icin
    # RPM'e cevrilir. 0.100 m yaricapta 2.670353756 m/s tam 255 RPM'dir.
    # Bu yalniz ust komut siniridir; normal surus hizlari ayri profillerde
    # daha dusuk tutulmalidir.
    max_wheel_speed: 2.670353756
    # STM32'ye giden RPM hedefi icin kalibrasyon carpani. Varsayilan davranis
    # degismez; gecici testte command_rpm_scale:=2.0 ile iki kat uygulanabilir.
    command_rpm_scale: 1.0
    # Encoder sayaci isaretli int32'de sarar. Iki okuma arasi |Δtick| bundan
    # buyukse cerceve atilir (UART copu / tek-kare bozulma). 3 ardısık redde
    # referans yeniden alinir (STM32 reset).
    max_tick_delta: 2000
    max_consecutive_tick_rejects: 3

    # --- Zamanlama ---
    command_rate: 50.0
    read_rate: 200.0
    # /cmd_vel susarsa arac durur. STM32 watchdog'u (200 ms) son savunma
    # hatti; bu deger normal isleyisteki ilk hat.
    cmd_vel_timeout: 0.5

    # Her STM32 odometri paketindeki gercek teker hizini, son gonderilen hedef
    # ile birlikte CSV'ye yazar. Terminal cikisi analiz icin 2 Hz ile sinirli.
    wheel_measurement_log_enabled: true
    wheel_measurement_log_directory: ~/.ros/marco_wheel_logs
    wheel_measurement_terminal_rate_hz: 2.0

    # --- Cerceveler ---
    odom_frame: odom
    base_frame: base_footprint
    # KAPALI KALMALI. odom -> base_footprint donusumunu robot_localization
    # EKF'i yayinlar. Ikisi birlikte yayinlarsa TF agacinda cakisma olur.
    # Yalnizca EKF olmadan cikplak odometri denenirken true yapilir.
    publish_tf: false

    # STM32 STATE_ODOMETRY paketindeki float32 imu_yaw (derece), elektronik
    # yerlesimde arac yaw acisidir ve /imu/data_raw olarak yayinlanir.
    imu_frame_id: imu_link
    # Fiziksel sola donuste imu_yaw azaliyorsa -1.0 yap.
    imu_angle_sign: 1.0
    imu_yaw_stddev_deg: 3.0
    imu_yaw_rate_stddev: 0.08

    # --- Odometri gurultu modeli ---
    # Kovaryans anlik hiza gore olceklenir. EKF bu odometriyi
    # yalniz encoderdan hesaplanan vx/vyaw alanlarini tuketecek. Pose ve twist
    # birlikte fuzyona alinmaz; odom0_differential bu nedenle false'dur.
    linear_noise_ratio: 0.02
    angular_noise_ratio: 0.05
    min_noise: 0.001

    # --- Sahte donanim hata enjeksiyonu ---
    # Yalnizca use_fake_hardware: true iken etkili. Sifir birakildiginda
    # taklit kusursuz davranir. Kalibrasyon araci gelistirilirken bilinen
    # hata uretmek icin kullanilir.
    fake_slip_factor: 0.0
    fake_wheel_scale_error_left: 0.0
    fake_wheel_scale_error_right: 0.0
    fake_wheel_separation_actual: 0.0
