### slam_toolbox — MarCO online async haritalama ###
#
# Filtrelenmis 2D LaserScan (/scan) + diferansiyel odometri.
# Bu dosya /opt/ros/humble/.../mapper_params_online_async.yaml uzerinden
# turetilmistir; degisen her satir asagida gerekcelidir.
#
# TF zinciri (mapping sirasinda):
#   map -> odom          slam_toolbox yayinlar
#   odom -> base_footprint   EKF (veya base_driver publish_tf:=true)
#   base_footprint -> ...    robot_state_publisher
#
# ONEMLI:
# - /scan BEST_EFFORT QoS ile geliyor; slam_toolbox bunu kendisi dinler.
# - RViz'i Orange Pi uzerinde mapping sirasinda ACMA (CPU acligi /scan'i
#   bozar). Kayit-oynat veya uzak makine kullan.
# - Teker RPM komutu, odometri ve IMU ayni base_driver seri baglantisindadir.

slam_toolbox:
  ros__parameters:
    # --- Cozucucu ---
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # --- Cerceveler / topikler ---
    odom_frame: odom
    map_frame: map
    # base_footprint: donme merkezinin zemindeki izdusumu. CAD olcumuyle
    # base_link tahrik aksinda; footprint onun z=0 projeksiyonu.
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: mapping

    debug_logging: false
    # 10 Hz LiDAR, her taramayi isle. CPU sikisirsa 2'ye cikarilir.
    throttle_scans: 1
    transform_publish_period: 0.02
    # Harita gorseli 2 saniyede bir yenilensin; video demosu icin yeterince
    # canli, Orange Pi CPU'sunu da asiri yormaz.
    map_update_interval: 2.0
    # 5 cm hucre: sartname +/-7.5 cm istasyon toleransinin altinda.
    # Daha ince (2.5 cm) harita 4x bellek yer; saha 60 dk penceresinde
    # 5 cm yeterli, AMCL de ayni cozunurlukte calisir.
    resolution: 0.05
    # Tmini Pro menzili. Varsayilan 20 m bu birimde gecerli olcum uretmez
    # ve bos hucreleri "bilinmeyen" diye sifirlar.
    min_laser_range: 0.20
    max_laser_range: 12.0
    # RPLIDAR yaklasik 11.6 Hz (86 ms) tarar. 80 ms, donuste ardışık scan
    # araligini buyutmeyip neredeyse her taramanin degerlendirilmesini saglar.
    # Pose graph dugum esikleri asagidaki travel ayarlaridir.
    minimum_time_interval: 0.08
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    # Interactive mode RViz plugin'i ister; Orange Pi'de RViz yokken
    # false tutmak guvenli. Uzak RViz icin true yapilabilir.
    enable_interactive_mode: false

    # --- Genel SLAM ---
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.25
    minimum_travel_heading: 0.35
    scan_buffer_size: 10
    # Isin menzili degil, buffer'daki tarama POZLARI arasindaki mesafe siniri.
    # Bu nedenle max_laser_range ile ayni olmak zorunda degildir.
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: false
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # --- Korelasyon ---
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # --- Scan matcher ---
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
