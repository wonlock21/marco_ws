### SLAMTEC RPLIDAR A2M12 — marco_ws aktif LiDAR konfigürasyonu ###
#
# Akış: rplidar_node /scan -> /scan_raw remap -> laser_filters -> /scan
# A2M12 için SLAMTEC'in resmi ROS 2 ayarı 256000 baud ve Sensitivity
# tarama modudur. Fiziksel montaj pozu URDF'deki laser_link TF'inde temsil
# edilir; driver frame_id bu nedenle laser_link olarak kalır.

rplidar_node:
  ros__parameters:
    channel_type: serial
    serial_port: /dev/marco_lidar
    serial_baudrate: 256000
    frame_id: laser_link
    inverted: false
    angle_compensate: true
    scan_mode: Sensitivity
