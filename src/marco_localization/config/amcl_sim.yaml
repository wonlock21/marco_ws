amcl:
  ros__parameters:
    use_sim_time: true
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: /scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.02
    tf_broadcast: true
    transform_tolerance: 0.25
    save_pose_rate: 1.0
    min_particles: 300
    max_particles: 1200
    pf_err: 0.03
    pf_z: 0.99
    resample_interval: 1
    update_min_d: 0.04
    update_min_a: 0.04
    laser_model_type: likelihood_field
    laser_min_range: 0.03
    laser_max_range: 12.0
    laser_likelihood_max_dist: 1.0
    max_beams: 90
    sigma_hit: 0.12
    z_hit: 0.80
    z_rand: 0.20
    z_short: 0.0
    z_max: 0.0
    lambda_short: 0.1
    do_beamskip: false
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    set_initial_pose: false
    always_reset_initial_pose: false
    first_map_only: true

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""
    topic_name: map
    frame_id: map

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names: [map_server, amcl]
    bond_timeout: 4.0
    attempt_respawn_reconnection: true
    bond_respawn_max_duration: 10.0
