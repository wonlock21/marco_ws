imgprocess_node:
  ros__parameters:
    camera_device: /dev/marco_front_camera
    # Kamerayi yalniz usb_cam acar. Serit takip ortak ham ROS goruntusunu
    # tuketir; boylece web ve QR istemcileri kamera cihaziyla cakisma yaratmaz.
    camera_input: ros_topic
    camera_topic: /camera/image_raw
    camera_compressed_topic: /camera/image_raw/compressed
    camera_timeout: 0.50
    frame_width: 640
    frame_height: 480
    frame_rate: 25.0
    show_debug_window: true
    # RK3588 Mali-G610 OpenCL. /dev/mali0 erisilemezse dugum guvenli bicimde
    # CPU'ya duser; OpenCL sorgusu surucu yokken yapilmaz.
    use_gpu: true
    gpu_device: /dev/mali0

    # IDLE durumunda topic susturulur; boylece twist_mux Nav2 komutunu secer.
    # /task_command uzerinden START_LANE veya START_APPROACH ile etkinlesir.
    startup_mode: IDLE
    output_topic: /cmd_vel_lane

    kp_qr: 0.005
    # Geriye uyumluluk icin tutuluyor. Serit donusu artik kamera merkezinden
    # kenarlara -1..+1 normalize edilerek max_angular_speed'e olceklenir.
    kp_lane: 0.00030
    qr_linear_speed: 0.10
    # Duzlukte 0.50 m/s, 200 mm teker capinda yaklasik 48 RPM'dir.
    # base_driver cmd_vel'i teker RPM hedeflerine cevirerek STM32'ye yollar.
    lane_linear_speed: 0.125
    # Donus buyudukce ortak hiz lineer azalir; tam donuste 0.125 m/s'ye iner.
    lane_min_linear_speed: 0.0625
    # Dusuk geciren filtre: kucuk deger daha yumusak, fakat daha gec tepki verir.
    lane_steering_alpha: 0.75 #0.90
    # Onceki sert donusu merkezde tasimamak icin azaltma/yon degisiminde hizli
    # sondurme. Yalniz hedef acisal hiz kuculurken devreye girer.
    lane_steering_release_alpha: 0.90
    # Tam kamera genisliginde lineer kontrol. 0.015, 640 px goruntude merkez
    # cevresinde yaklasik +/-5 px gibi dar bir olu bolge birakir.
    lane_center_deadband_ratio: 0.005
    # Serit denetleyici modu:
    # - pd_lookahead: IPM look-ahead hatasindan gercek PD kontrol
    # - offset_heading: alt bant yanal ofset + ust bant yon bilgisi
    # - legacy: onceki merkezlenmis hata + yon birlestirme mantigi
    lane_control_mode: pd_lookahead
    # Yanal ofset agirligi. Buyudukce arac merkeze daha istekli doner.
    lane_offset_gain: 2.00
    # Ust banttaki serit yonunun agirligi. Buyudukce donus daha erken baslar.
    lane_heading_gain: 4.00
    # Normalize look-ahead hatasi icin PD: angular = Kp*e + Kd*de/dt.
    # Integral terimi bilerek yoktur. D terimi kamera gurultusune karsi
    # derivative_alpha ile yumusatilir; dt ROS saatinden hesaplanir.
    # Alt bolge ofseti ve uydurulan serit egimi birlesik PD hatasini olusturur.
    lane_pd_kp: 0.150 #0.115
    lane_pd_kd: 0.045
    lane_pd_derivative_alpha: 0.10
    # Merkezde yumusak, dis bolgede tam otoriteli iki parcali lineer kontrol.
    lane_pd_center_zone: 0.60
    lane_pd_center_gain: 0.55
    # Tek karelik algilama kaybinda son komutu tutar; ikinci kayip karede
    # motor komutu guvenli bicimde sifirlanir.
    lane_loss_hold_frames: 1
    # Serit sonu yalniz arac son gorulen karede seride yakin/paralelken ve
    # kayip yaklasik 0.75 s surerse onaylanir. Kenardan cikis donus baslatmaz.
    lane_end_min_seen_frames: 30
    lane_end_missing_frames: 15
    lane_end_max_offset_ratio: 0.20
    lane_end_max_heading_error: 0.18
    # Yerel ortalamaya dayali adaptif siyah maske. Tum goruntu genisligi
    # islenir; value_max parlak zemin dokularini maske disinda tutar.
    lane_adaptive_value_max: 140
    lane_adaptive_block_size: 81
    lane_adaptive_offset: 20
    # IPM noktalari normalize (x,y) ve sirayla:
    # sol-alt, sol-ust, sag-ust, sag-alt. 640x480 kamera, 20 cm yukseklik ve
    # yaklasik 45 derece egim icin arac seride ortali/paralelken kalibre edildi.
    # Bu yamuk seridi kusbakisinda dik, sabit genislikte ve merkezde tutar.
    lane_ipm_enabled: true
    lane_ipm_source_points: [0.050, 0.950, 0.224, 0.050, 0.654, 0.050, 0.848, 0.950]
    lane_ipm_destination_points: [0.20, 1.00, 0.20, 0.00, 0.80, 0.00, 0.80, 1.00]
    # Alt bolgedeki yanal sapmayi dogrudan duzeltmek icin 480 px IPM
    # goruntusunde lookahead satiri araca yakin bolgeye alinmistir.
    lane_lookahead_y: 280
    # Tek satir/zemin lekesi kaynakli merkez sicramalarini dikey ortalamayla azalt.
    lane_lookahead_band_half_height: 30
    # Yeni RPM kapali cevriminde eski 50-55 PWM kalkis ofseti uygulanmaz.
    # wheel_separation base_driver ile ayni olmalidir.
    lane_min_wheel_speed: 0.000
    wheel_separation: 0.433
    # P kazanci kucuk/orta hatada tam sayi RPM farkini erken olusturur. Daha
    # dusuk acisal sinir ise ekran kenarinda pivot benzeri 0/4 yerine yaklasik
    # 1/3 RPM ile daha yumusak manevra yaptirir.
    max_angular_speed: 0.250 #0.500000

turnaround_node:
  ros__parameters:
    lane_command_topic: /cmd_vel_lane
    output_topic: /cmd_vel
    odom_topic: /odom
    control_rate: 30.0
    turn_angle_degrees: 180.0
    # +1: saat yonunun tersi (sol), -1: saat yonu (sag).
    turn_direction: 1
    # Donus 0.24 rad/s ile sinirli; son yaklasik 60 derecede 0.18 rad/s'ye
    # kadar iner. Ayri kalkis/yavaslama rampalari silkelenmeyi ve hedefteki
    # tasma miktarini azaltir. Dusuk hiz saha testinde motor esigine gore
    # turn_min_angular_speed ile ince ayarlanabilir.
    turn_max_angular_speed: 0.24
    turn_min_angular_speed: 0.18
    turn_angular_gain: 0.22
    turn_angular_acceleration: 0.12
    turn_angular_deceleration: 0.18
    turn_tolerance_degrees: 2.5
    settle_duration: 0.80
    stop_duration: 0.80
    lane_command_timeout: 0.25
    odom_timeout: 0.50
    # Sikisma/odom sorunu halinde sonsuza kadar donus komutu verme.
    turn_timeout: 25.0
