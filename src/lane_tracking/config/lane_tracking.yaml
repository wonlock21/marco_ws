imgprocess_node:
  ros__parameters:
    camera_device: /dev/video0
    frame_width: 320
    frame_height: 240
    frame_rate: 30.0
    show_debug_window: true
    # RK3588 Mali-G610 OpenCL. /dev/mali0 erisilemezse dugum guvenli bicimde
    # CPU'ya duser; OpenCL sorgusu surucu yokken yapilmaz.
    use_gpu: true
    gpu_device: /dev/mali0

    # IDLE durumunda topic susturulur; boylece twist_mux Nav2 komutunu secer.
    # /task_command uzerinden START_LANE veya START_APPROACH ile etkinlesir.
    startup_mode: IDLE
    output_topic: /cmd_vel_lane

    kp_qr: 0.005
    # Geriye uyumluluk icin tutuluyor. Serit donusu artik kamera merkezinden
    # kenarlara -1..+1 normalize edilerek max_angular_speed'e olceklenir.
    kp_lane: 0.00030
    qr_linear_speed: 0.10
    # Duzlukte ilk 0.20 m/s degerinin ucte biri. Donus keskinlestikce
    # lane_min_linear_speed seviyesine dogrusal olarak iner.
    lane_linear_speed: 0.060
    lane_min_linear_speed: 0.016
    # Dusuk geciren filtre: kucuk deger daha yumusak, fakat daha gec tepki verir.
    lane_steering_alpha: 0.20
    # Onceki sert donusu merkezde tasimamak icin azaltma/yon degisiminde hizli
    # sondurme. Yalniz hedef acisal hiz kuculurken devreye girer.
    lane_steering_release_alpha: 0.60
    # Tam kamera genisliginde lineer kontrol. 0.01, 640 px goruntude merkez
    # cevresinde yaklasik +/-3 px gibi dar bir olu bolge birakir.
    lane_center_deadband_ratio: 0.01
    # Alt banttaki yanal hata ile ust banttaki serit yonunu birlestirir.
    # Bu sayede serit kadrajdan cikmadan donus daha erken baslar.
    lane_heading_gain: 0.35
    # Yaklasik 30 FPS'te 100 ms'lik tekil algilama kayiplarini tolere eder;
    # dorduncu kayip karede motor komutu guvenli bicimde sifirlanir.
    lane_loss_hold_frames: 3
    # Yerel ortalamaya dayali adaptif siyah maske. Tum goruntu genisligi
    # islenir; value_max parlak zemin dokularini maske disinda tutar.
    lane_adaptive_value_max: 140
    lane_adaptive_block_size: 81
    lane_adaptive_offset: 18
    # Gercek motorlar yaklasik 50 mm/s altinda statik surtunmeyi asamiyor.
    # Donuste ortak ileri hiz, yavas teker bu esigin altina dusmeyecek kadar
    # otomatik yukseltilir. wheel_separation base_driver ile ayni olmalidir.
    lane_min_wheel_speed: 0.055
    wheel_separation: 0.460
    # Uzak konumlarda donus yetkisi; merkezdeki komut hala lineer ve sakindir.
    max_angular_speed: 0.075
